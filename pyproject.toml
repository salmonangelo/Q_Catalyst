[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "q-catalyst"
version = "0.1.0"
description = "Mechanism-aware quantum-AI triage for PETase engineering"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=15",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "matplotlib>=3.8",
  "biopython>=1.83",
  "PyYAML>=6",
  "requests>=2.31",
]

[project.optional-dependencies]
protein = [
  "torch>=2.2,<3",
  "transformers==4.49.0",
  "safetensors>=0.4",
]
test = [
  "pytest>=8",
  "httpx>=0.27",
]
api = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
]
chemistry = [
  "pyscf>=2.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
