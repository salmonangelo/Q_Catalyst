[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qcatalyst"
version = "1.0.0"
description = "Context-aware, mechanism-informed prioritisation of PETase variants using protein AI, uncertainty-guided computational chemistry, and quantum-chemistry validation."
authors = [{ name = "Q-Catalyst Research Team" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "pyarrow>=12.0",
  "scikit-learn>=1.3",
  "xgboost>=1.7",
  "streamlit>=1.30",
  "plotly>=5.18",
  "pyyaml>=6.0",
  "biopython>=1.80",
  "matplotlib>=3.8",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]
test = [
  "pytest>=7.0",
  "httpx>=0.27",
]
protein = [
  "torch>=2.2,<3",
  "transformers==4.49.0",
  "safetensors>=0.4",
]
api = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
]
chemistry = [
  "pyscf>=2.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
